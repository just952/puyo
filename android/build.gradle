apply plugin: 'com.android.application'

android {
    namespace 'com.puyo.game'
    compileSdk 33

    defaultConfig {
        applicationId "com.puyo.game"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
}

// Extract native .so files from the resolved dependencies into jniLibs
task extractNativeLibs {
    doLast {
        def artifacts = configurations.debugRuntimeClasspath.resolve()
        artifacts.each { file ->
            if (file.name.endsWith('.jar') && (file.name.contains('natives-armeabi-v7a') || file.name.contains('natives-arm64-v8a'))) {
                def abi = file.name.contains('armeabi-v7a') ? 'armeabi-v7a' : 'arm64-v8a'
                def destDir = new File(projectDir, "src/main/jniLibs/$abi")
                destDir.mkdirs()
                
                def zipTree = zipTree(file)
                zipTree.matching { include '**/*.so' }.each { entry ->
                    def targetFile = new File(destDir, entry.name)
                    targetFile.withOutputStream { out ->
                        entry.newInputStream().withStream { inp ->
                            out << inp
                        }
                    }
                    println "Extracted ${entry.name} -> $abi/ (${targetFile.length()} bytes)"
                }
            }
        }
        
        // Rename libgdx-freetype.so to libpenguin.so for each ABI
        ['armeabi-v7a', 'arm64-v8a'].each { abi ->
            def freetypeFile = new File(projectDir, "src/main/jniLibs/$abi/libgdx-freetype.so")
            def penguinFile = new File(projectDir, "src/main/jniLibs/$abi/libpenguin.so")
            if (freetypeFile.exists()) {
                if (penguinFile.exists()) {
                    penguinFile.delete()
                }
                freetypeFile.renameTo(penguinFile)
                println "Renamed libgdx-freetype.so -> libpenguin.so for $abi"
            }
        }
    }
}

preBuild.dependsOn(extractNativeLibs)

task ensureJniLibsDirs {
    doLast {
        ['armeabi-v7a', 'arm64-v8a'].each { abi ->
            new File(projectDir, "src/main/jniLibs/$abi").mkdirs()
        }
    }
}
preBuild.dependsOn(ensureJniLibsDirs)
