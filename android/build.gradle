apply plugin: 'com.android.application'

android {
    namespace 'com.puyo.game'
    compileSdk 33

    defaultConfig {
        applicationId "com.puyo.game"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
}

// Extract native .so files from gdx-platform dependencies into jniLibs
task extractNativeLibs(type: Copy) {
    // Resolve the native artifacts from implementation configuration
    from configurations.implementation
        .filter { it.name.contains('natives-armeabi-v7a') || it.name.contains('natives-arm64-v8a') }
    include "**/*.so"
    into "src/main/jniLibs"
    // Flatten the directory structure - put all .so files directly under jniLibs/<abi>/
    eachFile { f ->
        def fileName = f.file.name
        def abi = fileName.contains('armeabi-v7a') ? 'armeabi-v7a' :
                  fileName.contains('arm64-v8a') ? 'arm64-v8a' : 'unknown'
        if (abi != 'unknown') {
            f.path = "$abi/${fileName.replace('libgdx', 'libgdx')}"
        }
    }
}

// Ensure native libs are extracted before building
preBuild.dependsOn(extractNativeLibs)