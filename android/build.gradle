apply plugin: 'com.android.application'  
  
android {  
    namespace 'com.puyo.game'  
    compileSdk 33  
  
    defaultConfig {  
        applicationId 'com.puyo.game'  
        minSdk 21  
        targetSdk 33  
        versionCode 1  
        versionName '1.0'  
  
        ndk {  
            abiFilters 'armeabi-v7a', 'arm64-v8a'  
        }  
    }  
  
    buildTypes {  
        release {  
            minifyEnabled false  
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'  
        }  
    }  
  
    sourceSets {
        main {
            // core 모듈의 assets (JAR 내 assets/ 경로) 포함
            assets.srcDirs = ['src/main/assets', '../../core/build/resources/main/assets']
        }
    }
  
    packagingOptions {  
        jniLibs {  
            useLegacyPackaging = true  
        }  
    }  
}  
  
dependencies {  
    implementation project(':core')  
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"  
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"  
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"  
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"  
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"  
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"  
}

// mergeDebugNativeLibs 태스크 완료 후 libgdx-freetype.so → libpenguin.so 복사 (둘 다 필요)
// libgdx-freetype.so: System.loadLibrary("gdx-freetype")용
// libpenguin.so: 네이티브 코드 내부 dlopen("libpenguin.so")용
tasks.whenTaskAdded { task ->
    if (task.name == 'mergeDebugNativeLibs' || task.name == 'mergeReleaseNativeLibs') {
        task.doLast {
            ['arm64-v8a', 'armeabi-v7a'].each { abi ->
                def libDir = file("$buildDir/intermediates/merged_native_libs/" +
                    task.name.replace('merge', '').replace('NativeLibs', '').toLowerCase() +
                    "/out/lib/$abi")
                def srcFile = new File(libDir, "libgdx-freetype.so")
                def dstFile = new File(libDir, "libpenguin.so")
                if (srcFile.exists()) {
                    if (dstFile.exists()) dstFile.delete()
                    java.nio.file.Files.copy(srcFile.toPath(), dstFile.toPath())
                    println "Copied libgdx-freetype.so -> libpenguin.so for $abi"
                }
            }

            // Python lief로 SONAME 패치 (llvm-objcopy --set-soname 미지원)
            def patchScript = file("$rootDir/patch_soname.py")
            if (patchScript.exists()) {
                def cmd = ["cmd", "/c", "python", patchScript.absolutePath]
                def proc = cmd.execute()
                proc.waitFor()
                if (proc.exitValue() == 0) {
                    println "SONAME patched successfully via Python lief"
                } else {
                    println "WARNING: SONAME patch failed: ${proc.err.text}"
                }
            } else {
                println "WARNING: patch_soname.py not found at $patchScript, SONAME not patched"
            }
        }
    }
} 
