name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '17'
      ANDROID_COMPILE_SDK: 33
      ANDROID_BUILD_TOOLS: '33.0.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Install patchelf (for fixing SONAME)
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-${{ env.ANDROID_COMPILE_SDK }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'

      - name: Ensure no local.properties interferes
        run: |
          if [ -f local.properties ]; then
            echo "local.properties found – removing it to avoid conflicts"
            rm local.properties
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Test 단계
      - name: Run Headless Tests (core module)
        run: ./gradlew :core:test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test/

      - name: Build Debug APK
        run: ./gradlew :android:assembleDebug

      - name: Fix libpenguin.so SONAME in APK
        run: |
          set -x
          APK_PATH=$(find android/build/outputs/apk/debug -name "*.apk" | head -n1)
          APK_PATH=$(realpath "$APK_PATH")
          echo "APK: $APK_PATH"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi
          
          echo "=== APK lib contents ==="
          unzip -l "$APK_PATH" | grep -E "lib/arm64-v8a|lib/armeabi-v7a" || true
          
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          
          for abi in armeabi-v7a arm64-v8a; do
            echo "Processing $abi..."
            unzip -o "$APK_PATH" "lib/$abi/libpenguin.so" -d . 2>/dev/null
            if [ -f "lib/$abi/libpenguin.so" ]; then
              echo "Patching SONAME for $abi/libpenguin.so"
              patchelf --set-soname libpenguin.so "lib/$abi/libpenguin.so"
              echo "New SONAME: $(readelf -d "lib/$abi/libpenguin.so" | grep SONAME)"
              zip -u "$APK_PATH" "lib/$abi/libpenguin.so"
            else
              echo "WARNING: lib/$abi/libpenguin.so not found in APK"
            fi
          done
          
          cd /
          rm -rf "$TMPDIR"
          set +x

      - name: Verify native libs in APK
        run: |
          APK_PATH=$(find android/build/outputs/apk/debug -name "*.apk" | head -n1)
          APK_PATH=$(realpath "$APK_PATH")
          echo "APK_PATH=$APK_PATH"
          echo ">>> Checking lib folders in APK:"
          unzip -l "$APK_PATH" | grep -E 'lib/arm64-v8a|lib/armeabi-v7a' | head
          echo ">>> Verifying SONAME in APK:"
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          unzip -o "$APK_PATH" "lib/arm64-v8a/libpenguin.so" -d . 2>/dev/null
          if [ -f lib/arm64-v8a/libpenguin.so ]; then
            readelf -d lib/arm64-v8a/libpenguin.so | grep SONAME
          else
            echo "libpenguin.so not found in APK for verification"
          fi
          cd /
          rm -rf "$TMPDIR"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puyo-debug-apk
          path: android/build/outputs/apk/**/*.apk
