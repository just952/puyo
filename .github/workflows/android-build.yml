name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '17'
      ANDROID_COMPILE_SDK: 33
      ANDROID_BUILD_TOOLS: '33.0.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "cmdline-tools;latest"
          yes | sdkmanager --licenses

      - name: Ensure no local.properties interferes
        run: |
          if [ -f local.properties ]; then
            echo "local.properties found – removing it to avoid conflicts"
            rm local.properties
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Test 단계
      - name: Run Headless Tests (core module)
        run: ./gradlew :core:test --stacktrace
      # ──────────────

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test/

      - name: Build Debug APK
        run: ./gradlew :android:assembleDebug

      - name: Verify native libs in APK
        run: |
          APK_PATH=$(find android/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "APK_PATH=$APK_PATH"
          echo ">>> Checking lib folders in APK:"
          unzip -l "$APK_PATH" | grep -E 'lib/arm64-v8a|lib/armeabi-v7a' | head

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puyo-debug-apk
          path: android/build/outputs/apk/**/*.apk