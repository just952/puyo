name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '17'
      ANDROID_COMPILE_SDK: 33
      ANDROID_BUILD_TOOLS: '33.0.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Install patchelf (for fixing SONAME)
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-${{ env.ANDROID_COMPILE_SDK }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'

      - name: Ensure no local.properties interferes
        run: |
          if [ -f local.properties ]; then
            echo "local.properties found – removing it to avoid conflicts"
            rm local.properties
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Extract native libs and fix SONAME for libpenguin.so
      - name: Extract native libraries and fix SONAME
        run: |
          ./gradlew :android:extractNativeLibs --no-daemon
          # Fix SONAME of libpenguin.so copies
          for abi in armeabi-v7a arm64-v8a; do
            LIB_PATH="android/src/main/jniLibs/$abi/libpenguin.so"
            if [ -f "$LIB_PATH" ]; then
              echo "Patching SONAME for $LIB_PATH"
              patchelf --set-soname libpenguin.so "$LIB_PATH"
              echo "New SONAME: $(readelf -d "$LIB_PATH" | grep SONAME)"
            fi
          done

      # Test 단계
      - name: Run Headless Tests (core module)
        run: ./gradlew :core:test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test/

      - name: Build Debug APK
        run: ./gradlew :android:assembleDebug

      - name: Verify native libs in APK
        run: |
          APK_PATH=$(find android/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "APK_PATH=$APK_PATH"
          echo ">>> Checking lib folders in APK:"
          unzip -l "$APK_PATH" | grep -E 'lib/arm64-v8a|lib/armeabi-v7a' | head
          echo ">>> Verifying SONAME in APK:"
          unzip -o "$APK_PATH" "lib/arm64-v8a/libpenguin.so" -d /tmp/apk_check 2>/dev/null
          if [ -f /tmp/apk_check/lib/arm64-v8a/libpenguin.so ]; then
            readelf -d /tmp/apk_check/lib/arm64-v8a/libpenguin.so | grep SONAME
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puyo-debug-apk
          path: android/build/outputs/apk/**/*.apk
